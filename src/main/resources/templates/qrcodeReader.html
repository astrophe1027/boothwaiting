<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입장 패스 QR코드 스캐너</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { color: #333; margin-bottom: 20px; }

        /* 서버 주소 설정 바 */
        .config-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            width: 100%;
            max-width: 500px;
        }
        .config-bar input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .config-bar button {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .config-bar button:hover { opacity: 0.85; }
        .server-saved {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #666;
        }
        .server-saved a {
            cursor: pointer;
            font-size: 12px;
            color: #888;
            text-decoration: underline;
        }

        #interactive {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 350px;
            border: 4px solid #333;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        #interactive video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        .scan-laser {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 2px;
            background-color: red;
            box-shadow: 0 0 8px red;
            transform: translateY(-50%);
            z-index: 10;
            animation: blink 1s infinite;
        }
        @keyframes blink { 50% { opacity: 0.4; } }

        #result-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            display: none;
            z-index: 100;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .success { color: #4CAF50; }
        .error   { color: #F44336; }
    </style>
</head>
<body>

<h1>🎟️ 입장 패스 스캐너</h1>

<div class="config-bar" id="configBar">
    <input id="serverInput" type="text" placeholder="서버 주소 (예: http://192.168.0.10:8080)" />
    <button onclick="saveServer()">저장</button>
</div>
<div class="server-saved" id="serverSaved" style="display:none;">
    <span id="serverSavedText"></span>
    <a onclick="editServer()">변경</a>
</div>

<div id="interactive">
    <div class="scan-laser"></div>
</div>

<div id="result-toast"></div>

<script>
    const STORAGE_KEY = 'boothMonitorServer'; // monitor.html과 같은 키 공유

    const serverInput    = document.getElementById('serverInput');
    const configBar      = document.getElementById('configBar');
    const serverSaved    = document.getElementById('serverSaved');
    const serverSavedText = document.getElementById('serverSavedText');

    (function init() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) showSaved(saved);
        serverInput.value = saved || '';
    })();

    function saveServer() {
        const val = serverInput.value.trim().replace(/\/$/, '');
        if (!val) return;
        localStorage.setItem(STORAGE_KEY, val);
        showSaved(val);
    }

    function showSaved(url) {
        serverSavedText.textContent = '서버: ' + url;
        configBar.style.display = 'none';
        serverSaved.style.display = 'flex';
    }

    function editServer() {
        serverInput.value = localStorage.getItem(STORAGE_KEY) || '';
        serverSaved.style.display = 'none';
        configBar.style.display = 'flex';
        serverInput.focus();
    }

    function getBaseUrl() {
        return (localStorage.getItem(STORAGE_KEY) || 'http://localhost:8080').replace(/\/$/, '');
    }

    let isProcessing = false;
    let html5QrCode;

    function startScanner() {
        html5QrCode = new Html5Qrcode("interactive");

        const config = {
            fps: 30,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                return { width: Math.floor(minEdge * 0.9), height: Math.floor(minEdge * 0.9) };
            },
            aspectRatio:1.0,
            formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
        };

        html5QrCode.start(
            { facingMode: "environment"},
            config,
            onScanSuccess
        ).catch(err => {
            console.error("카메라 시작 실패:", err);
            alert("카메라를 초기화할 수 없습니다. 권한을 확인해주세요.");
        });
    }

    function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;
        playBeep();
        sendToServer(decodedText);
    }

    function sendToServer(qrData) {
        const url = `${getBaseUrl()}/api/entry?token=${encodeURIComponent(qrData)}`;

        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
        })
            .then(res => {
                if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
                return res.json();
            })
            .then(data => showToast(data.message, "success"))
            .catch(err => {
                console.error("통신 에러:", err);
                showToast("서버 연결에 실패했습니다.", "error");
            })
            .finally(() => {
                setTimeout(() => { isProcessing = false; }, 1000);
            });
    }

    function showToast(message, type) {
        const toast = document.getElementById("result-toast");
        toast.innerHTML = `<span class="${type}">${message}</span>`;
        toast.style.display = "block";
        setTimeout(() => { toast.style.display = "none"; }, 2500);
    }

    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime);
            oscillator.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        } catch (e) {
            console.warn("오디오 플레이 실패:", e);
        }
    }

    window.addEventListener("DOMContentLoaded", startScanner);
</script>
</body>
</html>
