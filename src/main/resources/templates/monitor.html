<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>부스 실시간 모니터</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        /* Pico CSS 커스텀 스타일 보완 */
        :root {
            --pico-font-size: 95%;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
        }

        .status-entered {
            background-color: var(--pico-ins-color);
            color: #fff;
        }

        .status-called {
            background-color: var(--pico-primary-background);
            color: var(--pico-primary-inverse);
        }

        .status-temp {
            background-color: #f2994a;
            color: #fff;
        }

        .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--pico-muted-color);
            border-radius: 50%;
            margin-right: 6px;
        }

        .live-active .live-dot {
            background-color: #2ec4b6;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* 테이블 스크롤 바 방지 및 깔끔한 높이 관리 */
        .table-container {
            overflow-x: auto;
        }

        .updated-time {
            font-size: 0.85rem;
            color: var(--pico-muted-color);
        }
    </style>
</head>
<body>

<nav class="container">
    <ul>
        <li><strong>BOOTH MONITOR</strong></li>
    </ul>
    <ul>
        <li>
                <span id="badge" class="status-badge" style="background-color: var(--pico-card-background-color); border: 1px solid var(--pico-border-color); color: var(--pico-muted-color);">
                    <span class="live-dot"></span><span id="badgeText">연결 대기 중</span>
                </span>
        </li>
    </ul>
</nav>

<main class="container">

    <details>
        <summary role="button" class="outline secondary">서버 연결 설정</summary>
        <article>
            <fieldset class="grid">
                <label for="serverInput">
                    서버 주소
                    <input id="serverInput" type="text" placeholder="http://localhost:8080" />
                </label>
                <label for="passwordInput">
                    비밀번호
                    <input id="passwordInput" type="password" placeholder="Client Password" />
                </label>
            </fieldset>
            <button onclick="connect()" class="contrast">설정 저장 및 연결</button>
        </article>
    </details>

    <section class="grid">
        <article style="text-align: center; padding: 1rem;">
            <p style="margin-bottom: 0; color: var(--pico-muted-color); font-size: 0.9rem;">실시간 입장자</p>
            <h2 id="accountCount" style="margin-bottom: 0; color: var(--pico-primary);">0명</h2>
        </article>
        <article style="text-align: center; padding: 1rem;">
            <p style="margin-bottom: 0; color: var(--pico-muted-color); font-size: 0.9rem;">실시간 대기자</p>
            <h2 id="waitingCount" style="margin-bottom: 0; color: #a78bfa;">0명</h2>
        </article>
        <article style="text-align: center; padding: 1rem; display: flex; flex-direction: column; justify-content: center;">
            <p style="margin-bottom: 0; color: var(--pico-muted-color); font-size: 0.9rem;">마지막 업데이트</p>
            <span id="updatedAt" class="updated-time">—</span>
        </article>
    </section>

    <div class="grid">

        <section>
            <article>
                <header>
                    <h4 style="margin-bottom: 0;">🟢 입장자 현황</h4>
                </header>
                <div class="table-container">
                    <table class="striped">
                        <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">학번</th>
                            <th scope="col">이름</th>
                            <th scope="col">상태</th>
                        </tr>
                        </thead>
                        <tbody id="accountBody">
                        <tr><td colspan="4" style="text-align: center; color: var(--pico-muted-color);">서버 연결이 필요합니다.</td></tr>
                        </tbody>
                    </table>
                </div>
            </article>
        </section>

        <section>
            <article>
                <header>
                    <h4 style="margin-bottom: 0;">⏳ 대기자 현황</h4>
                </header>
                <div class="table-container">
                    <table class="striped">
                        <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">학번</th>
                            <th scope="col">이름</th>
                            <th scope="col">연락처</th>
                        </tr>
                        </thead>
                        <tbody id="waitingBody">
                        <tr><td colspan="4" style="text-align: center; color: var(--pico-muted-color);">서버 연결이 필요합니다.</td></tr>
                        </tbody>
                    </table>
                </div>
            </article>
        </section>

    </div>

</main>

<script>
    const STORAGE_SERVER_KEY = 'boothMonitorServer';
    const STORAGE_PASS_KEY = 'boothMonitorPassword';
    let stompClient = null;

    const serverInput = document.getElementById('serverInput');
    const passwordInput = document.getElementById('passwordInput');

    serverInput.value = localStorage.getItem(STORAGE_SERVER_KEY) || 'http://localhost:8080';
    passwordInput.value = localStorage.getItem(STORAGE_PASS_KEY) || '';

    function connect() {
        const base = serverInput.value.trim().replace(/\/$/, '');
        const password = passwordInput.value;

        localStorage.setItem(STORAGE_SERVER_KEY, base);
        localStorage.setItem(STORAGE_PASS_KEY, password);

        if (stompClient && stompClient.connected) {
            stompClient.disconnect();
        }

        setBadge(false, '연결 중...');

        // REST API 호출 (스냅샷 로딩)
        const restHeaders = {};
        if (password) {
            restHeaders['X-Client-Password'] = password;
        }

        fetch(`${base}/api/monitor`, {
            headers: restHeaders
        })
            .then(r => {
                if (!r.ok) throw new Error();
                return r.json();
            })
            .then(render)
            .catch(() => {
                const errorMsg = '데이터를 불러올 수 없습니다. 인증을 확인하세요.';
                document.getElementById('accountBody').innerHTML = emptyRow(4, errorMsg);
                document.getElementById('waitingBody').innerHTML = emptyRow(4, errorMsg);
                setBadge(false, '인증 실패');
            });

        // WebSocket(SockJS) 연결
        const socketUrl = password ? `${base}/ws?token=${encodeURIComponent(password)}` : `${base}/ws`;
        const socket = new SockJS(socketUrl, null, { transports: ['websocket'] });

        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, () => {
            setBadge(true, '실시간 연결됨');
            stompClient.subscribe('/topic/monitor', msg => {
                render(JSON.parse(msg.body));
            });
        }, () => {
            if(document.getElementById('badgeText').textContent !== '인증 실패') {
                setBadge(false, '연결 끊김');
            }
        });
    }

    function render(data) {
        const { accounts = [], waitings = [] } = data;

        const now = new Date();
        document.getElementById('updatedAt').textContent =
            `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

        document.getElementById('accountCount').textContent = `${accounts.length}명`;
        document.getElementById('waitingCount').textContent = `${waitings.length}명`;

        // 입장자 렌더링
        const ab = document.getElementById('accountBody');
        if (accounts.length === 0) {
            ab.innerHTML = emptyRow(4, '현재 입장 중인 학생이 없습니다.');
        } else {
            ab.innerHTML = accounts.map((a, i) => {
                let statusClass = 'status-temp';
                let statusLabel = 'TEMP EXIT';

                if (a.status === 'ENTERED') {
                    statusClass = 'status-entered';
                    statusLabel = 'ENTERED';
                } else if (a.status === 'CALLED') {
                    statusClass = 'status-called';
                    statusLabel = 'CALLED';
                }

                return `<tr>
                        <td><strong>${i + 1}</strong></td>
                        <td><code>${a.studentId}</code></td>
                        <td>${a.name}</td>
                        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                    </tr>`;
            }).join('');
        }

        // 대기자 렌더링
        const wb = document.getElementById('waitingBody');
        if (waitings.length === 0) {
            wb.innerHTML = emptyRow(4, '현재 대기 중인 인원이 없습니다.');
        } else {
            wb.innerHTML = waitings.map((w, i) => `<tr>
                    <td><strong>${i + 1}</strong></td>
                    <td><code>${w.studentId}</code></td>
                    <td>${w.name}</td>
                    <td><small>${w.phoneNumber}</small></td>
                </tr>`).join('');
        }
    }

    function setBadge(live, text) {
        const b = document.getElementById('badge');
        const badgeText = document.getElementById('badgeText');

        if (live) {
            b.classList.add('live-active');
            b.style.borderColor = 'var(--pico-ins-color)';
            b.style.color = 'var(--pico-ins-color)';
        } else {
            b.classList.remove('live-active');
            b.style.borderColor = 'var(--pico-border-color)';
            b.style.color = 'var(--pico-muted-color)';
            if (text === '인증 실패') {
                b.style.borderColor = 'var(--pico-del-color)';
                b.style.color = 'var(--pico-del-color)';
            }
        }
        badgeText.textContent = text;
    }

    function emptyRow(cols, msg) {
        return `<tr><td colspan="${cols}" style="text-align: center; color: var(--pico-muted-color); padding: 2rem 0;">${msg}</td></tr>`;
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    // 초기 실행
    connect();
</script>
</body>
</html>
