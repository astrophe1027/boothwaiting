<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퇴장 처리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
        }
        main {
            width: 100%;
            max-width: 500px;
            margin-top: 5vh;
        }
        input, button { font-size: 16px !important; }

        .config-wrapper {
            margin-bottom: 1.5rem;
        }
        .config-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 0.5rem;
        }
        .config-bar input { flex: 1; margin: 0; }
        .config-bar button {
            width: auto; margin: 0;
            padding: 0.5rem 1rem !important;
            white-space: nowrap;
        }

        #result-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            display: none;
            z-index: 100;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .success { color: #4CAF50; }
        .error   { color: #F44336; }
    </style>
</head>
<body>

<main class="container">
    <article>
        <header>
            <h2 style="margin-bottom: 0;">🚪 퇴장 처리</h2>
        </header>

        <div class="config-wrapper" id="configArea">
            <div class="config-bar">
                <input id="serverInput" type="text" placeholder="서버 주소 (예: http://192.168.0.10:8080)" />
            </div>
            <div class="config-bar">
                <input id="passwordInput" type="password" placeholder="비밀번호 입력" />
                <button class="secondary" onclick="saveServer()">저장</button>
            </div>
        </div>

        <label for="studentId">학번 (5자리)
            <input type="text"
                   id="studentId"
                   placeholder="12345"
                   pattern="\d{5}"
                   maxlength="5"
                   inputmode="numeric"
                   title="학번 5자리를 입력해주세요"
                   autofocus />
        </label>

        <button id="exitBtn" onclick="handleExit()">퇴장 처리</button>
    </article>
</main>

<div id="result-toast"></div>

<script>
    const STORAGE_SERVER_KEY = 'boothMonitorServer';
    const STORAGE_PASS_KEY = 'boothMonitorPassword';

    const serverInput  = document.getElementById('serverInput');
    const passwordInput = document.getElementById('passwordInput');
    const configArea   = document.getElementById('configArea');

    // 초기화: 처음 사이트 열었을 때 로컬스토리지에 값이 있다면 입력창에 미리 채워둠 (창은 열려있음)
    (function init() {
        serverInput.value = localStorage.getItem(STORAGE_SERVER_KEY) || '';
        passwordInput.value = localStorage.getItem(STORAGE_PASS_KEY) || '';
    })();

    function saveServer() {
        const urlVal = serverInput.value.trim().replace(/\/$/, '');
        const passVal = passwordInput.value;

        if (!urlVal) {
            showToast('서버 주소를 입력해주세요.', 'error');
            return;
        }

        // 로컬스토리지에 주소와 비밀번호 모두 저장
        localStorage.setItem(STORAGE_SERVER_KEY, urlVal);
        localStorage.setItem(STORAGE_PASS_KEY, passVal);

        // 설정 영역 숨기기
        configArea.style.display = 'none';
        document.getElementById('studentId').focus();
    }

    function getBaseUrl() {
        return (localStorage.getItem(STORAGE_SERVER_KEY) || 'http://localhost:8080').replace(/\/$/, '');
    }

    function getPassword() {
        return localStorage.getItem(STORAGE_PASS_KEY) || '';
    }

    document.getElementById('studentId').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleExit();
    });

    async function handleExit() {
        const studentIdInput = document.getElementById('studentId');
        const studentId = studentIdInput.value.trim();

        if (!/^\d{5}$/.test(studentId)) {
            showToast('학번은 5자리 숫자여야 합니다.', 'error');
            return;
        }

        const btn = document.getElementById('exitBtn');
        btn.setAttribute('aria-busy', 'true');
        btn.disabled = true;

        try {
            const headers = {
                'Content-Type': 'application/json'
            };

            // 로컬스토리지에서 비밀번호를 가져와 헤더에 포함
            const currentPassword = getPassword();
            if (currentPassword) {
                headers['X-Client-Password'] = currentPassword;
            }

            const res = await fetch(`${getBaseUrl()}/api/entry?studentId=${encodeURIComponent(studentId)}`, {
                method: 'DELETE',
                headers: headers
            });
            const data = await res.json();
            showToast(data.message, res.ok ? 'success' : 'error');
            if (res.ok) studentIdInput.value = '';
        } catch (err) {
            showToast('서버 연결에 실패했습니다.', 'error');
        } finally {
            btn.removeAttribute('aria-busy');
            btn.disabled = false;
            studentIdInput.focus();
        }
    }

    function showToast(message, type) {
        const toast = document.getElementById('result-toast');
        toast.innerHTML = `<span class="${type}">${message}</span>`;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }
</script>
</body>
</html>
